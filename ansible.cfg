# MesaLista · configuración de Ansible para este proyecto.
# Se usa sola al ejecutar ansible-playbook desde esta carpeta.

[defaults]
inventory = inventario.yml
roles_path = roles
# Salida legible (cada tarea con su resultado en YAML).
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
# La huella SSH de la máquina se acepta una vez a mano (ssh azureuser@…): así
# Ansible no se conecta a otra máquina que se haga pasar por la tuya.
host_key_checking = True
# No dejar archivos *.retry.
retry_files_enabled = False

[ssh_connection]
# Más rápido: menos conexiones por tarea. La conexión se mantiene viva durante
# las tareas largas (la instalación tarda varios minutos).
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
