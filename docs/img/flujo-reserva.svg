<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5e554d"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#221c17">Un viaje completo: el cliente pulsa «Confirmar reserva»</text>

  <!-- Cabeceras de columnas -->
  <g font-weight="700" text-anchor="middle">
    <rect x="20" y="44" width="150" height="40" rx="8" fill="#eef3fb" stroke="#4a6fa5"/><text x="95" y="69" fill="#22344f">Navegador</text>
    <rect x="200" y="44" width="150" height="40" rx="8" fill="#f6e7e2" stroke="#a8432a"/><text x="275" y="69" fill="#5c2416">nginx</text>
    <rect x="380" y="44" width="160" height="40" rx="8" fill="#fff7e0" stroke="#c98a09"/><text x="460" y="62" fill="#5a3d00">WEB</text><text x="460" y="77" font-size="11" font-weight="400" fill="#5a3d00">rutas.js → confirmar.js</text>
    <rect x="570" y="44" width="160" height="40" rx="8" fill="#e7f4ec" stroke="#2f8f5b"/><text x="650" y="62" fill="#174a2e">API</text><text x="650" y="77" font-size="11" font-weight="400" fill="#174a2e">routes.js → booking.js</text>
    <rect x="760" y="44" width="120" height="40" rx="8" fill="#ece8f6" stroke="#6b5ca5"/><text x="820" y="69" fill="#2f2656">PostgreSQL</text>
  </g>
  <g stroke="#c9bfb5" stroke-width="1.2" stroke-dasharray="4 4">
    <path d="M95,84 L95,620"/><path d="M275,84 L275,620"/><path d="M460,84 L460,620"/><path d="M650,84 L650,620"/><path d="M820,84 L820,620"/>
  </g>

  <g stroke="#5e554d" stroke-width="1.6" fill="none" marker-end="url(#f)">
    <path d="M95,118 L273,118"/>
    <path d="M275,152 L458,152"/>
    <path d="M460,250 L648,250"/>
    <path d="M650,320 L818,320"/>
    <path d="M820,360 L652,360"/>
    <path d="M650,420 L462,420"/>
    <path d="M460,500 L277,500"/>
    <path d="M275,530 L97,530"/>
    <path d="M95,575 L273,575"/>
  </g>

  <text x="100" y="110" fill="#22344f">① POST /reservar/confirmar (formulario + token CSRF + cookie)</text>
  <text x="282" y="144" fill="#5c2416">② lo reenvía a 127.0.0.1:8092</text>

  <text x="470" y="176" fill="#5a3d00">③ app.js: sesión, CSRF ✔</text>
  <text x="470" y="194" fill="#5a3d00">④ rutas.js: '/reservar/confirmar'</text>
  <text x="470" y="210" fill="#5a3d00">   → paginas/cliente/confirmar.js</text>
  <text x="470" y="228" fill="#5a3d00">⑤ Api.cliente('POST', '/reservations', {…})</text>

  <text x="470" y="270" font-size="11.5" fill="#174a2e">⑥ POST /api/v1/reservations · Authorization: Bearer …</text>
  <text x="470" y="286" font-size="11.5" fill="#174a2e">{"request_id":"…","date":"2026-11-28","time":"21:00","party":4}</text>

  <text x="660" y="304" fill="#174a2e">⑦ routes.js → booking.createForClient</text>
  <text x="660" y="340" font-size="11.5" fill="#2f2656">⑧ busca mesa libre, INSERT</text>
  <text x="660" y="378" font-size="11.5" fill="#2f2656">⑨ fila guardada (id 15)</text>

  <text x="470" y="440" font-size="11.5" fill="#174a2e">⑩ 201 {"reservation": {"id": 15, "status": "confirmed", …}}</text>
  <text x="470" y="456" font-size="11.5" fill="#174a2e">   (si algo falla: 409 {"error": {"code": "conflict", …}})</text>

  <text x="470" y="480" fill="#5a3d00">⑪ Sesion.aviso('¡Reserva confirmada!…') · Vista.redirigir('/reservas/15')</text>
  <text x="282" y="522" fill="#5c2416">⑫ 303 Location: /reservas/15</text>

  <text x="100" y="567" fill="#22344f">⑬ el navegador pide GET /reservas/15 (otra vuelta: rutas.js → cliente/reserva.js</text>
  <text x="100" y="595" fill="#22344f">   → GET /api/v1/reservations/15 → vistas/cliente/reserva.ejs) y se ve la reserva con su QR</text>
</svg>
