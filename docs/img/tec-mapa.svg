  <text x="178" y="150" font-size="11" fill="#5e554d">HTTPS</text>
  <text x="508" y="150" font-size="11" fill="#5e554d">HTTPS · JSON · Bearer</text>
  <text x="352" y="344" font-size="10.5" fill="#5e554d">JSON</text>
  <text x="352" y="484" font-size="10.5" fill="#5e554d">SQL</text>
  <path d="M640,126 Q 900 140 870 260" stroke="#c98a09" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-start="url(#f)"/>
  <text x="664" y="146" font-size="11" fill="#c98a09">aviso push al móvil</text>
